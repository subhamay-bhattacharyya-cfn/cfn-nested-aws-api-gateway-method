AWSTemplateFormatVersion: '2010-09-09'

Description: 'Nested CloudFormation template to create an API Gateway REST API mmethod'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Common Configuration"
        Parameters:
          - ProjectName
          - Environment
      - Label:
          default: "API Configuration"
        Parameters:
          - PathPart
      - Label:
          default: "Existing API Configuration (non-CI only)"
        Parameters:
          - RestApiId
          - ParentId
          - ExistingResourceId
      - Label:
          default: "Method Configuration"
        Parameters:
          - HttpMethod
          - AuthorizationType
          - LambdaFunctionArn
          - IntegrationType
          - IntegrationHttpMethod
      - Label:
          default: "Advanced Configuration"
        Parameters:
          - CiSuffix
    ParameterLabels:
      ProjectName:
        default: "Project Name"
      PathPart:
        default: "Path Part"
      RestApiId:
        default: "REST API ID"
      ParentId:
        default: "Parent Resource ID"
      ExistingResourceId:
        default: "Existing Resource ID"
      HttpMethod:
        default: "HTTP Method"
      AuthorizationType:
        default: "Authorization Type"
      LambdaFunctionArn:
        default: "Lambda Function ARN"
      IntegrationType:
        default: "Integration Type"
      IntegrationHttpMethod:
        default: "Integration HTTP Method"
      Environment:
        default: "Environment"
      CiSuffix:
        default: "CI Suffix"

Parameters:
  ProjectName:
    Type: String
    Default: "cfn-nested"
    Description: "Project name to use as a name prefix"
    MinLength: 1
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: "Project name must be lowercase letters, numbers, and hyphens only"

  PathPart:
    Type: String
    Default: "orders"
    MinLength: 1
    MaxLength: 256
    AllowedPattern: "^[a-zA-Z0-9._{}-]+$"
    ConstraintDescription: "Path part must be 1-256 characters and can only contain letters, numbers, periods, underscores, and hyphens"
    Description: "Path segment created under the REST API root resource"

  RestApiId:
    Type: String
    Default: ""
    Description: "ID of an existing API Gateway REST API. Required when CiSuffix is empty (not a CI build). Ignored for CI builds."

  ParentId:
    Type: String
    Default: ""
    Description: "ID of the parent resource (usually the root resource ID of the existing REST API) under which PathPart is created. Required when CiSuffix is empty (not a CI build). Ignored for CI builds."

  ExistingResourceId:
    Type: String
    Default: ""
    Description: "ID of the existing API Gateway resource the method is attached to. Required when CiSuffix is empty (not a CI build). Ignored for CI builds, where the method attaches to the resource created by PathPart."

  HttpMethod:
    Type: String
    Default: "GET"
    AllowedValues:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "HEAD"
      - "OPTIONS"
      - "ANY"
    Description: "HTTP method for the API Gateway method"

  AuthorizationType:
    Type: String
    Default: "AWS_IAM"
    AllowedValues:
      - "AWS_IAM"
      - "NONE"
    Description: "Authorization type for the method. AWS_IAM requires SigV4 credentials (for example, AgentCore Gateway and direct callers)."

  LambdaFunctionArn:
    Type: String
    Default: "arn:aws:lambda:us-east-1:123456789012:function:dummy-function"
    AllowedPattern: "^arn:aws[a-zA-Z-]*:lambda:[a-z0-9-]+:[0-9]{12}:function:[a-zA-Z0-9-_]+(:[a-zA-Z0-9-_]+)?$"
    ConstraintDescription: "Must be a valid Lambda function ARN (arn:aws:lambda:region:account-id:function:name)"
    Description: "ARN of the Lambda function invoked by the method (AWS_PROXY integration). Used for non-CI builds only; CI builds create their own ListOrders function."

  IntegrationType:
    Type: String
    Default: "AWS_PROXY"
    AllowedValues:
      - "AWS_PROXY"
      - "AWS"
    Description: "Integration type. Both values invoke the Lambda function in LambdaFunctionArn; AWS_PROXY passes the whole request to the function, AWS maps it through integration request and response templates."

  IntegrationHttpMethod:
    Type: String
    Default: "POST"
    AllowedValues:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "HEAD"
      - "OPTIONS"
      - "ANY"
    Description: "HTTP method API Gateway uses to call the integration. Lambda invocations require POST."

  Environment:
    Type: String
    Default: "devl"
    AllowedValues:
      - "devl"
      - "test"
      - "prod"
    Description: "Deployment environment"

  CiSuffix:
    Type: String
    Default: ""
    Description: "CI suffix appended to the REST API name. A non-empty value marks a CI build pipeline, which creates the REST API. Leave empty to use RestApiId and ParentId instead."

Rules:
  RequireExistingApiWhenNotCi:
    RuleCondition: !Equals [!Ref CiSuffix, ""]
    Assertions:
      - Assert: !Not [!Equals [!Ref RestApiId, ""]]
        AssertDescription: "RestApiId is required when CiSuffix is empty"
      - Assert: !Not [!Equals [!Ref ParentId, ""]]
        AssertDescription: "ParentId is required when CiSuffix is empty"
      - Assert: !Not [!Equals [!Ref ExistingResourceId, ""]]
        AssertDescription: "ExistingResourceId is required when CiSuffix is empty"

Conditions:
  IsCiBuild: !Not [!Equals [!Ref CiSuffix, ""]]

Resources:
  LambdaFunctionRole:
    Type: AWS::IAM::Role
    Condition: IsCiBuild
    Metadata:
      com.aws.cloudformation.Context:
        why: "Execution role for the basic ListOrders Lambda function created by CI builds. Grants CloudWatch Logs write access only."
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  LambdaFunction:
    Type: AWS::Lambda::Function
    Condition: IsCiBuild
    Metadata:
      com.aws.cloudformation.Context:
        why: "Basic Lambda function created by CI builds and invoked by RestApiMethod through AWS_PROXY. Returns a static JSON response."
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt LambdaFunctionRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import json

          def handler(event, context):
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({"message": "Hello from ListOrders"}),
              }
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsCiBuild
    Metadata:
      com.aws.cloudformation.Context:
        why: "Allows API Gateway to invoke the CI-built Lambda function for the method's HTTP method and path."
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/${HttpMethod}/${PathPart}"

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Condition: IsCiBuild
    Metadata:
      com.aws.cloudformation.Context:
        why: "API Gateway REST API created by the CI build pipeline. Methods, resources, and a deployment are not yet defined."
        must:
          - "Must tag the API with ProjectName and Environment for cost allocation and ownership tracking"
    Properties:
      Name: !Sub '${ProjectName}-api-${AWS::AccountId}-${Environment}-${AWS::Region}-${CiSuffix}'
      Description: "API Description"
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  RestApiResource:
    Type: AWS::ApiGateway::Resource
    Condition: IsCiBuild
    Metadata:
      com.aws.cloudformation.Context:
        why: "Adds the path segment set by PathPart (default /orders) under the REST API root. Endpoints are attached to this resource as child resources and methods."
        trust:
          src: infer
          conf: low
          note: "rationale not documented"
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: !Ref PathPart

  RestApiMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      com.aws.cloudformation.Context:
        why: "API Gateway method that proxies requests to a Lambda function. CI builds invoke the ListOrders function created in this stack; non-CI builds invoke LambdaFunctionArn. The invoke permission is granted for CI builds only."
    Properties:
      RestApiId: !If [IsCiBuild, !Ref RestApi, !Ref RestApiId]
      ResourceId: !If [IsCiBuild, !Ref RestApiResource, !Ref ExistingResourceId]
      HttpMethod: !Ref HttpMethod
      # Require SigV4 credentials for AgentCore Gateway and direct callers by default.
      AuthorizationType: !Ref AuthorizationType
      Integration:
        Type: !Ref IntegrationType
        IntegrationHttpMethod: !Ref IntegrationHttpMethod
        Uri: !If
          - IsCiBuild
          - !Sub
            - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
            - FunctionArn: !GetAtt LambdaFunction.Arn
          - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations"

Outputs:
  RestApiMethodId:
    Description: "ID of the API Gateway method created (RestApiMethod)"
    Value: !Ref RestApiMethod

  ListOrdersFunctionArn:
    Condition: IsCiBuild
    Description: "ARN of the basic Lambda function created by CI builds"
    Value: !GetAtt LambdaFunction.Arn

